<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>ІМПЕРСЬКИЙ ТЕРМІНАЛ: WIKI-READER</title>
    <style>
        body { background-color: #d4d0c8; font-family: "Times New Roman", serif; margin: 0; padding: 20px; display: flex; justify-content: center; }
        
        .window {
            width: 850px;
            background-color: #d4d0c8;
            border: 2px outset #fff;
            box-shadow: 4px 4px 0px #000;
            display: flex;
            flex-direction: column;
        }

        .title-bar {
            background: linear-gradient(to right, #000040, #000080);
            color: #ffd700;
            padding: 4px 10px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }

        .search-area {
            padding: 20px;
            text-align: center;
            border-bottom: 2px groove #fff;
        }

        .input-group { display: flex; gap: 5px; justify-content: center; }

        input[type="text"] {
            width: 400px; padding: 8px; border: 2px inset #eee;
            font-family: 'Courier New', monospace; outline: none;
        }

        button {
            padding: 5px 20px; background: #d4d0c8; border: 2px outset #fff;
            cursor: pointer; font-weight: bold; font-size: 12px;
        }

        /* Контейнер вывода */
        #display-container {
            background: #fff;
            margin: 10px;
            padding: 20px;
            min-height: 450px;
            max-height: 600px;
            overflow-y: auto;
            border: 2px inset #808080;
        }

        /* Стили списка результатов */
        .wiki-item { margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px dotted #999; }
        .wiki-title { color: #0000ee; font-size: 19px; text-decoration: underline; cursor: pointer; font-weight: bold; }
        .wiki-snippet { font-size: 14px; color: #333; margin-top: 5px; }

        /* Стили просмотра статьи */
        .article-view { animation: fadeIn 0.3s forwards; }
        .back-link { 
            display: inline-block; color: #000; background: #eee; 
            border: 1px solid #808080; padding: 3px 10px; 
            text-decoration: none; cursor: pointer; margin-bottom: 15px; font-size: 13px;
        }
        .article-header { border-bottom: 3px double #000080; color: #000080; margin-bottom: 15px; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .status-bar { background: #d4d0c8; padding: 3px 10px; font-size: 11px; border-top: 1px solid #808080; }
    </style>
</head>
<body>

<div class="window">
    <div class="title-bar">
        <span>TRG_WIKI_READER.EXE — Перегляд бази знань</span>
        <span>Слава Імператору! [X]</span>
    </div>

    <div class="search-area" id="searchHeader">
        <div style="color: #000080; font-weight: bold; margin-bottom: 10px;">АРХІВНА СЛУЖБА ТОРГМАСУ</div>
        <div class="input-group">
            <input type="text" id="query" placeholder="Введіть запит...">
            <button onclick="searchWiki()">ПОШУК</button>
        </div>
    </div>

    <div id="display-container">
        <p style="text-align: center; color: #808080; margin-top: 150px;">Введіть дані для ініціалізації зчитування...</p>
    </div>

    <div class="status-bar">
        Ізольований режим перегляду: АКТИВНО | JSON-STREAM
    </div>
</div>

<script>
    let lastResults = ""; // Сохраняем результаты поиска для возврата назад

    async function searchWiki() {
        const query = document.getElementById('query').value;
        const container = document.getElementById('display-container');
        if (!query.trim()) return;

        container.innerHTML = 'Завантаження списку...';

        try {
            const url = `https://uk.wikipedia.org/w/api.php?action=query&list=search&format=json&origin=*&srlimit=15&srsearch=${encodeURIComponent(query)}`;
            const response = await fetch(url);
            const data = await response.json();
            const results = data.query.search;

            if (results.length === 0) {
                container.innerHTML = 'Нічого не знайдено.';
                return;
            }

            renderResults(results);
        } catch (e) {
            container.innerHTML = 'Помилка зв\'язку.';
        }
    }

    function renderResults(results) {
        const container = document.getElementById('display-container');
        let html = '';
        results.forEach(item => {
            html += `
                <div class="wiki-item">
                    <div class="wiki-title" onclick="readArticle('${item.pageid}', '${item.title.replace(/'/g, "\\'")}')">${item.title}</div>
                    <div class="wiki-snippet">${item.snippet}...</div>
                </div>
            `;
        });
        container.innerHTML = html;
        lastResults = html; // Запоминаем текущий список
    }

    async function readArticle(pageId, title) {
        const container = document.getElementById('display-container');
        container.innerHTML = 'Зчитування повного тексту...';

        try {
            // Запрос на получение содержания статьи по её ID
            const url = `https://uk.wikipedia.org/w/api.php?action=query&prop=extracts&exintro&explaintext&format=json&origin=*&pageids=${pageId}`;
            const response = await fetch(url);
            const data = await response.json();
            const content = data.query.pages[pageId].extract;

            container.innerHTML = `
                <div class="article-view">
                    <div class="back-link" onclick="goBack()">← Назад до результатів</div>
                    <div class="article-header"><h2>${title}</h2></div>
                    <div style="line-height: 1.6; font-size: 16px;">
                        ${content.replace(/\n/g, '<br><br>')}
                    </div>
                    <hr>
                    <small style="color:#666;">Джерело: Глобальна мережа (ретрансляція TRG)</small>
                </div>
            `;
        } catch (e) {
            container.innerHTML = 'Помилка при зчитуванні статті.';
        }
    }

    function goBack() {
        document.getElementById('display-container').innerHTML = lastResults;
    }

    document.getElementById('query').addEventListener('keypress', (e) => { if (e.key === 'Enter') searchWiki(); });
</script>

</body>
</html>
